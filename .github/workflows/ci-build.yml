name: Jogasaki-CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      os:
        type: string
        default: 'ubuntu-22.04'
      cmake_build_option:
        type: string
        default: ''
      distributed_query_stack_root:
        description: 'Absolute path of an isolated prebuilt stack on the runner'
        type: string
        default: ''

jobs:
  Test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.distributed_query_stack_root == '' }}
    runs-on: [self-hosted, docker]
    permissions:
      checks: write
    timeout-minutes: 30
    container:
      image: ghcr.io/project-tsurugi/tsurugi-ci:${{ inputs.os || 'ubuntu-22.04' }}
      volumes:
        - ${{ vars.ccache_dir }}:${{ vars.ccache_dir }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_CONFIGPATH: ${{ vars.ccache_dir }}/ccache.conf
      CCACHE_DIR: ${{ vars.ccache_dir }}/${{ inputs.os || 'ubuntu-22.04' }}
      SHARKSFIN_IMPLEMENTATION: shirakami

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install_Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          sharksfin_implementation: ${{ env.SHARKSFIN_IMPLEMENTATION }}
          cmake_build_option: ${{ inputs.cmake_build_option }}

      - name: CMake_Build
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DSHARKSFIN_IMPLEMENTATION=${SHARKSFIN_IMPLEMENTATION} -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/.local -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON -DBUILD_DOCUMENTS=ON ${{ inputs.cmake_build_option }} ..
          cmake --build . --target all --clean-first

      - name: CTest
        env:
          GTEST_OUTPUT: xml
          ASAN_OPTIONS: detect_stack_use_after_return=true
        run: |
          export LSAN_OPTIONS=suppressions=${GITHUB_WORKSPACE}/etc/lsan/suppress.txt
          cd build
          ctest --verbose --timeout 240 -j 16

      - name: Verify
        uses: project-tsurugi/tsurugi-annotations-action@v2
        if: always()
        with:
          ctest_input: 'build/test/gtest_results/**/*.xml'

  Analysis:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.distributed_query_stack_root == '' }}
    runs-on: [self-hosted, docker]
    permissions:
      checks: write
    timeout-minutes: 30
    container:
      image: ghcr.io/project-tsurugi/tsurugi-ci:almalinux-latest
      volumes:
        - ${{ vars.ccache_dir }}:${{ vars.ccache_dir }}
        - ${{ vars.ctcache_dir }}:${{ vars.ctcache_dir }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_CONFIGPATH: ${{ vars.ccache_dir }}/ccache.conf
      CCACHE_DIR: ${{ vars.ccache_dir }}/almalinux-latest

      CTCACHE_DISABLE: ${{ vars.ctcache_disable }}
      CTCACHE_DIR: ${{ vars.ctcache_dir }}/almalinux-latest
      CTCACHE_SAVE_OUTPUT: 1
      CTCACHE_LOCAL: 1
      CTCACHE_CLANG_TIDY: ${{ vars.ctcache_clang_tidy }}

      CC: clang
      CXX: clang++
      SHARKSFIN_IMPLEMENTATION: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install_Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          sharksfin_implementation: ${{ env.SHARKSFIN_IMPLEMENTATION }}
          cmake_build_option: -DUSE_GRPC_CONFIG=ON ${{ inputs.cmake_build_option }}

      - name: CMake_Build
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DSHARKSFIN_IMPLEMENTATION=${SHARKSFIN_IMPLEMENTATION} -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/.local -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=ON -DBUILD_STRICT=OFF -DBUILD_DOCUMENTS=ON ${{ inputs.cmake_build_option }} ..
          cmake --build . --target all --clean-first

      - name: Clang-Tidy
        run: |
          python3 tools/bin/run-clang-tidy.py -clang-tidy-binary=/opt/ctcache/clang-tidy -quiet -export-fixes=build/clang-tidy-fix.yaml -p build -extra-arg=-Wno-unknown-warning-option -header-filter=$(pwd)'/(include|src)/.*\.h$' $(pwd)'/src/.*' 2>&1 | awk '!a[$0]++{print > "build/clang-tidy.log"}'

      - name: Doxygen
        run: |
          cd build
          ninja doxygen 2> >(tee doxygen-error.log)

      - name: Verify
        uses: project-tsurugi/tsurugi-annotations-action@v2
        if: always()

  Integration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.distributed_query_stack_root != '' }}
    runs-on: [self-hosted, docker]
    timeout-minutes: 60
    env:
      DQ_STACK_ROOT: ${{ inputs.distributed_query_stack_root }}
    steps:
      - uses: actions/checkout@v6
      - name: Run C1, C2 and acceptance checks
        shell: bash
        run: |
          python3 test/integration/distributed_query_suite.py \
            --stack-manifest "$DQ_STACK_ROOT/stack-manifest.json" \
            --prefix "$DQ_STACK_ROOT/install" \
            --server "$DQ_STACK_ROOT/build-bootstrap/src/tsurugidb" \
            --tgctl "$DQ_STACK_ROOT/build-bootstrap/src/tgctl" \
            --tgsql "$DQ_STACK_ROOT/tgsql" \
            --client-jar "$DQ_STACK_ROOT/tgsql.jar" \
            --jni-library "$DQ_STACK_ROOT/libtsubakuro.so" \
            --work-dir "$RUNNER_TEMP/dq-integration-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --database-name-prefix "$(id -un)-dq-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-query-results
          path: |
            ${{ runner.temp }}/dq-integration-${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            ${{ runner.temp }}/dq-integration-${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            ${{ runner.temp }}/dq-integration-${{ github.run_id }}-${{ github.run_attempt }}/**/*.ini
          retention-days: 14
